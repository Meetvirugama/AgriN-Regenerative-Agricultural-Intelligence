databases:
  - name: agrimesh-db
    databaseName: agrimesh
    user: agrimesh

services:
  - type: web
    name: agrimesh-api-gateway
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrimesh-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PYTHON_SERVICE_URL
        value: https://agrimesh-ai-service.onrender.com/api/v1 # Update once Render generates the ai-service URL (or use its internal URL)
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        value: https://agri-n-regenerative-agricultural-in.vercel.app
        
  - type: web
    name: agrimesh-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
