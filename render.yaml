databases:
  - name: agrimesh-db
    databaseName: agrimesh
    user: agrimesh

services:
  - type: web
    name: agrimesh-api-gateway
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrimesh-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_URL
        value: https://agrimesh-ai-service.onrender.com # Wait for Render to generate this URL or use internal URL
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-app-url.vercel.app # Update this with your actual Vercel URL
        
  - type: web
    name: agrimesh-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
